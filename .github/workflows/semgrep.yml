name: Semgrep

on:
  pull_request: {}
  workflow_dispatch: {}
  push:
    branches:
      - main
      - develop
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  checks: write
  pull-requests: write
  security-events: write

jobs:
  semgrep:
    name: Análisis de seguridad con Semgrep
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ejecutar análisis de Semgrep
        # Actualizado a la acción oficial y moderna de Semgrep
        uses: semgrep/github-action@v1 
        with:
          config: >-
            p/owasp-top-ten
            p/security-audit
          generateSarif: true
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Subir comentarios y alertas a GitHub Code Scanning
        # Sube el reporte SARIF para que GitHub comente el PR de forma nativa
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        if: always() # Se ejecuta incluso si Semgrep encuentra vulnerabilidades y falla
