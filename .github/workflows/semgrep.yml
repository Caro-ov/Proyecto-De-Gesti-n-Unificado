name: Semgrep

on:
  pull_request: {}
  workflow_dispatch: {}
  push:
    branches:
      - main
      - develop
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  checks: write
  pull-requests: write
  security-events: write

jobs:
  semgrep:
    name: Análisis de seguridad con Semgrep
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Semgrep (CLI gratuito)
        run: pip install semgrep

      - name: Ejecutar análisis de Semgrep
        run: |
          semgrep --config p/owasp-top-ten --config p/security-audit \
                  --sarif --output semgrep.sarif . || true

      - name: Subir alertas a GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
        if: always()
