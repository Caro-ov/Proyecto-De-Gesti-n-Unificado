name: Semgrep

on:
  pull_request: {}
  workflow_dispatch: {}
  push:
    branches:
      - main
      - develop
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  checks: write
  pull-requests: write
  security-events: write

jobs:
  semgrep:
    name: Análisis de seguridad con Semgrep
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4 # Versión estable y moderna
        with:
          fetch-depth: 0

      - name: Ejecutar análisis de Semgrep
        uses: semgrep/semgrep-action@v1 
        with:
          config: >-
            p/owasp-top-ten
            p/security-audit
          # SOLUCIÓN: Le pasamos la instrucción de generar el SARIF directamente a Semgrep
          args: --sarif --output=semgrep.sarif
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Subir comentarios y alertas a GitHub Code Scanning
        # ACTUALIZADO: Pasamos a v4 para limpiar las advertencias de Node.js y obsolescencia
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
        if: always() # Obligatorio para que suba los resultados incluso si encuentra fallos
